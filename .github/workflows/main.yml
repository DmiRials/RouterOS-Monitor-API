name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.0.0)"
        required: false
        default: "v1.0.0"

      build_windows:
        description: "Build Windows"
        type: boolean
        required: true
        default: true

      build_linux:
        description: "Build Linux"
        type: boolean
        required: true
        default: true

      make_release:
        description: "Create GitHub Release"
        type: boolean
        required: true
        default: false

  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  APP_NAME: RouterOS-Monitor-API
  ENTRY_POINT: main.py
  PYTHON_VERSION: "3.13"

concurrency:
  group: build-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build-linux:
    name: Build Linux
    if: github.event_name == 'push' || github.event.inputs.build_linux == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Show Python Environment
        run: |
          python --version
          pip --version

      - name: Show Project Structure
        run: ls -lah

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.lock ]; then
            pip install -r requirements.lock
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "requirements file not found."
            exit 1
          fi

          if ! python -m pip show pyinstaller >/dev/null 2>&1; then
            pip install pyinstaller
          fi

      - name: Show PyInstaller Version
        run: pyinstaller --version

      - name: Build Application
        run: |
          pyinstaller "${{ env.ENTRY_POINT }}" \
            --onefile \
            --clean \
            --name "${{ env.APP_NAME }}"

      - name: Verify Build
        run: test -s "dist/${{ env.APP_NAME }}"

      - name: Show dist Folder
        run: ls -lah dist

      - uses: actions/upload-artifact@v5
        with:
          name: linux
          path: dist/${{ env.APP_NAME }}
          if-no-files-found: error

  build-windows:
    name: Build Windows
    if: github.event_name == 'push' || github.event.inputs.build_windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Show Python Environment
        shell: bash
        run: |
          python --version
          pip --version

      - name: Show Project Structure
        shell: bash
        run: ls -lah

      - name: Install Dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.lock ]; then
            pip install -r requirements.lock
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "requirements file not found."
            exit 1
          fi

          if ! python -m pip show pyinstaller >/dev/null 2>&1; then
            pip install pyinstaller
          fi

      - name: Show PyInstaller Version
        shell: bash
        run: pyinstaller --version

      - name: Build Application
        shell: bash
        run: |
          pyinstaller "${{ env.ENTRY_POINT }}" \
            --onefile \
            --clean \
            --name "${{ env.APP_NAME }}"

      - name: Verify Build
        shell: bash
        run: test -s "dist/${{ env.APP_NAME }}.exe"

      - name: Show dist Folder
        shell: bash
        run: ls -lah dist

      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: dist/${{ env.APP_NAME }}.exe
          if-no-files-found: error

  release:
    name: Create Release

    needs:
      - build-linux
      - build-windows

    if: >
      (github.event_name == 'push' ||
      github.event.inputs.make_release == 'true') &&
      !contains(needs.*.result, 'failure')

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/download-artifact@v5
        with:
          path: release
          merge-multiple: true

      - name: Show Release Files
        run: ls -lah release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.version }}
          name: ${{ env.APP_NAME }} ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.version }}
          generate_release_notes: true
          overwrite_files: true
          files: release/*
