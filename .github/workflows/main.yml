name: Build & Release Linux

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия релиза (например v1.0.0)"
        required: true
        default: "v1.0.0"

      make_release:
        description: "Создать GitHub Release"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build application
        run: |
          pyinstaller run.py \
            --onefile \
            --clean \
            --name RouterOS-Monitor-API

      - name: Show build output
        run: |
          echo "===== DIST ====="
          ls -lah dist

      - name: Generate SHA256
        run: |
          cd dist
          sha256sum RouterOS-Monitor-API > RouterOS-Monitor-API.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RouterOS-Monitor-API-Linux
          path: |
            dist/RouterOS-Monitor-API

  release:
    needs: build-linux
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.make_release == 'true' }}

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: RouterOS-Monitor-API-Linux
          path: dist

      - name: Show downloaded files
        run: ls -lah dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: RouterOS Monitor API ${{ github.event.inputs.version }}
          generate_release_notes: true
          files: |
            dist/RouterOS-Monitor-API
            
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
