name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.0.0)"
        required: false
        default: "v1.0.0"

      build_windows:
        description: "Build Windows"
        type: boolean
        required: true
        default: true

      build_linux:
        description: "Build Linux"
        type: boolean
        required: true
        default: true

      make_release:
        description: "Create GitHub Release"
        type: boolean
        required: true
        default: false

permissions:
  contents: write

jobs:
  build-windows:
    if: ${{ github.event.inputs.build_windows == 'true' }}
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.lock ]; then
            pip install -r requirements.lock
          else
            pip install -r requirements.txt
          fi

          pip install pyinstaller

      - name: Build
        shell: bash
        run: |
          pyinstaller run.py \
            --onefile \
            --clean \
            --name RouterOS-Monitor-API.exe

      - name: Verify
        shell: bash
        run: |
          test -f dist/RouterOS-Monitor-API.exe

      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: dist/RouterOS-Monitor-API.exe
          if-no-files-found: error

  build-linux:
    if: ${{ github.event.inputs.build_linux == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.lock ]; then
            pip install -r requirements.lock
          else
            pip install -r requirements.txt
          fi

          pip install pyinstaller

      - name: Build
        run: |
          pyinstaller run.py \
            --onefile \
            --clean \
            --name RouterOS-Monitor-API

      - name: Verify
        run: |
          test -f dist/RouterOS-Monitor-API

      - uses: actions/upload-artifact@v5
        with:
          name: linux
          path: dist/RouterOS-Monitor-API
          if-no-files-found: error

  release:
    needs:
      - build-windows
      - build-linux

    if: |
      always() &&
      github.event.inputs.make_release == 'true'

    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Show files
        run: ls -lah dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: RouterOS Monitor API ${{ github.event.inputs.version }}
          generate_release_notes: true
          overwrite_files: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
