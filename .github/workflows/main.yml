name: Build & Release

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: RouterOS-Monitor-API-linux-amd64
            executable: RouterOS-Monitor-API-linux-amd64

          - os: windows-latest
            artifact_name: RouterOS-Monitor-API-windows-amd64
            executable: RouterOS-Monitor-API-windows-amd64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.lock ]; then
            echo "Using requirements.lock"
            pip install -r requirements.lock
          else
            echo "Using requirements.txt"
            pip install -r requirements.txt
          fi

          pip install pyinstaller

      - name: Build application
        shell: bash
        run: |
          pyinstaller run.py \
            --onefile \
            --clean \
            --name "${{ matrix.executable }}"

      - name: Verify build
        shell: bash
        run: |
          test -f "dist/${{ matrix.executable }}"

      - name: Show build output
        shell: bash
        run: |
          ls -lah dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.executable }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: RouterOS-Monitor-API-linux-amd64
          path: dist

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: RouterOS-Monitor-API-windows-amd64
          path: dist

      - name: Show downloaded files
        run: ls -lah dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: RouterOS Monitor API ${{ github.ref_name }}
          generate_release_notes: true
          overwrite_files: true
          draft: false
          prerelease: false
          files: |
            dist/RouterOS-Monitor-API-linux-amd64
            dist/RouterOS-Monitor-API-windows-amd64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
