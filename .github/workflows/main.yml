name: Build Linux

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build
        run: |
          pyinstaller run.py \
            --onefile \
            --name RouterOS-Monitor-API

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: RouterOS-Monitor-API-Linux
          path: dist/RouterOS-Monitor-API
